name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chrome msedge webkit
            projects: --project=chrome --project=edge --project=safari-webkit
          - os: windows-latest
            browsers: chrome msedge
            projects: --project=chrome --project=edge
          - os: macos-latest
            browsers: webkit
            projects: --project=safari-webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx playwright install --with-deps ${{ matrix.browsers }}
      - run: bun run test:e2e ${{ matrix.projects }}
      - run: bun run test:e2e:server ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            artifacts/
            test-results/
            playwright-report/
            server-test-results/
          retention-days: 14
